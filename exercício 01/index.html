<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h1>Cadastro de alunos</h1>

<form id="form-aluno">
  <label>Nome do aluno
    <input id="nome" type="text" placeholder="Ex.: Carlos">
  </label>

  <label>Nota 1
    <input id="nota1" type="number" step="0.1" min="0" max="10">
  </label>

  <label>Nota 2
    <input id="nota2" type="number" step="0.1" min="0" max="10">
  </label>

  <button type="submit">Cadastrar</button>
</form>

<p id="resumo">Nenhum aluno cadastrado.</p>
<div id="lista"></div>
<script src="teste.js"></script>   
</body>
</html>
